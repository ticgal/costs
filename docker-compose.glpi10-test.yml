version: '3.8'

services:
  mysql:
    image: mysql:8.0
    platform: linux/amd64
    container_name: glpi10-mysql
    environment:
      MYSQL_ROOT_PASSWORD: glpi_root_pass
      MYSQL_DATABASE: glpi10_test
      MYSQL_USER: glpi_user
      MYSQL_PASSWORD: glpi_pass
    volumes:
      - glpi10-mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - glpi10-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "glpi_user", "-pglpi_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  glpi:
    image: diouxx/glpi:latest
    platform: linux/amd64
    container_name: glpi10-app
    environment:
      # GLPI 10.0.x version
      GLPI_VERSION: "10.0.16"
      MYSQL_HOST: mysql
      MYSQL_DATABASE: glpi10_test
      MYSQL_USER: glpi_user
      MYSQL_PASSWORD: glpi_pass
      TIMEZONE: UTC
    ports:
      - "8080:80"
    volumes:
      - glpi10-files:/var/www/html/glpi/files
      - glpi10-plugins:/var/www/html/glpi/plugins
      # Mount the costs plugin (read-only to prevent accidental modifications)
      - ./:/var/www/html/glpi/plugins/costs:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - glpi10-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  glpi10-mysql-data:
    name: glpi10-mysql-data
  glpi10-files:
    name: glpi10-files
  glpi10-plugins:
    name: glpi10-plugins

networks:
  glpi10-network:
    name: glpi10-network
    driver: bridge
